<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo | Puro Sabor</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f0f0f0;
            padding: 10px;
            color: #000;
        }

        /* Estilo de Ticket Térmico 80mm */
        .ticket {
            background: white;
            width: 80mm;
            /* Ancho estándar comanderas */
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }

        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px dashed #000;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .header .tagline {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .order-id {
            font-size: 0.7rem;
            color: #444;
        }

        .items {
            margin-bottom: 15px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px dotted #ccc;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-info {
            flex: 1;
            padding-right: 10px;
        }

        .item-name {
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .item-details {
            font-size: 0.75rem;
            color: #333;
            line-height: 1.2;
            margin-top: 2px;
        }

        .item-subtotal {
            font-weight: 800;
            font-size: 0.9rem;
            text-align: right;
        }

        .total-section {
            border-top: 1px solid #000;
            padding-top: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .total-amount {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .customer-info {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #000;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .customer-info strong {
            text-transform: uppercase;
            font-size: 0.7rem;
            color: #555;
        }

        .thanks {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border-top: 1px dashed #000;
            padding-top: 10px;
        }

        .btn-print {
            display: block;
            width: 100%;
            max-width: 80mm;
            margin: 20px auto;
            padding: 14px;
            background: #000;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .ticket {
                box-shadow: none;
                border: none;
                width: 100%;
                margin: 0;
                padding: 5px;
            }

            .btn-print {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="ticket" id="ticket">
        <div class="header">
            <h1 id="shop-name">PURO SABOR</h1>
            <div class="tagline">*** RECIBO DE PEDIDO ***</div>
            <div class="order-id" id="order-id">ID: 000000</div>
        </div>

        <div class="items" id="items-list">
            <p style="text-align:center;padding:20px;">Cargando pedido...</p>
        </div>

        <div class="total-section">
            <span class="total-label">TOTAL</span>
            <span class="total-amount" id="order-total">$0</span>
        </div>

        <div class="customer-info" id="customer-info"></div>

        <p class="thanks">¡GRACIAS POR TU COMPRA! 🤎</p>
    </div>

    <a href="javascript:window.print()" class="btn-print">🖨️ IMPRIMIR COMANDA</a>


    <script>
        // CONFIGURACIÓN MAESTRA (Sólo para Synergy Dev)
        const cloudUrl = 'https://script.google.com/macros/s/AKfycbxeo8pT8_Zo0zPbchpSYinMBWokiwH-ZhScZNQFwz7Amt08IRtHuRmsA1eV8Xkc2bK7/exec';

        function init() {
            try {
                const params = new URLSearchParams(window.location.search);
                let rawData = params.get('data');

                if (!rawData) throw new Error('Sin datos');

                // Decodificación segura Base64URL a Base64 estándar
                rawData = rawData.replace(/-/g, '+').replace(/_/g, '/');
                while (rawData.length % 4) {
                    rawData += '=';
                }

                // Decodificar Base64
                const json = JSON.parse(decodeURIComponent(escape(atob(rawData))));

                // Mapear alias a estructura legible (Soporta llaves viejas y nuevas)
                const data = {
                    id: json.i,
                    name: json.n,
                    phone: json.p,
                    total: json.t,
                    payment: json.m || 'S/E',
                    delivery: json.d || 'S/E',
                    address: json.a || 'Paso a Retirar',
                    time: json.h || json.time || 'S/E',
                    opts: {
                        cubiertos: json.o?.c !== undefined ? json.o.c : (json.opts?.cubiertos || false),
                        prio: json.o?.p !== undefined ? json.o.p : (json.opts?.prio || false),
                        zonaExtendida: json.o?.ze !== undefined ? json.o.ze : (json.opts?.zonaExtendida || false),
                        zonaPrincipal: json.o?.zp !== undefined ? json.o.zp : (json.opts?.zonaPrincipal || false)
                    },
                    items: (json.it || []).map(item => ({
                        n: item.n,
                        q: item.q,
                        p: item.p,
                        c: item.c || '',
                        note: item.o || ''
                    }))
                };

                renderOrder(data);

            } catch (err) {
                console.error(err);
                document.getElementById('ticket').innerHTML = `
                    <div class="error-page">
                        <i>⚠️</i>
                        <h2>No se pudo cargar el recibo</h2>
                        <p style="margin-top:10px; font-size: 0.8rem; color: #666;">Error: ${err.message}</p>
                        <p style="margin-top:10px;">El enlace puede estar incompleto o malformado por WhatsApp.</p>
                        <a href="index.html" style="display:inline-block;margin-top:20px;color:#d4850e;font-weight:600;">← Volver al menú</a>
                    </div>
                `;
            }
        }

        function renderOrder(data) {
            // Order ID
            document.getElementById('order-id').innerText = `ID: ${data.id}`;

            // Items
            const itemsEl = document.getElementById('items-list');
            itemsEl.innerHTML = data.items.map(i => `
                <div class="item-row">
                    <div class="item-info">
                        ${i.c ? `<div style="font-size: 0.6rem; color: #666; text-transform: uppercase; margin-bottom: 2px;">• ${i.c}</div>` : ''}
                        <div class="item-name">${i.n}</div>
                        ${i.note ? `<div class="item-details">${i.note}</div>` : ''}
                        <div class="item-details">$${i.p.toLocaleString('es-AR')} × ${i.q}</div>
                    </div>
                    <div class="item-subtotal">$${(i.p * i.q).toLocaleString('es-AR')}</div>
                </div>
            `).join('');

            // Add Options (Cutlery / Priority / Zona Extendida)
            if (data.opts.cubiertos || data.opts.prio || data.opts.zonaExtendida || data.opts.zonaPrincipal) {
                itemsEl.innerHTML += '<div style="margin-top:10px; padding-top:10px; border-top:1px dashed #000;"></div>';
                if (data.opts.cubiertos > 0) {
                    itemsEl.innerHTML += `
                        <div class="item-row" style="border:none; padding:2px 0;">
                            <div class="item-info"><div class="item-name" style="font-size:0.8rem;">🍴 INCLUIR CUBIERTOS x${data.opts.cubiertos}</div></div>
                            <div class="item-subtotal" style="font-size:0.8rem;">$${(200 * data.opts.cubiertos).toLocaleString('es-AR')}</div>
                        </div>
                    `;
                }
                if (data.opts.prio) {
                    itemsEl.innerHTML += `
                        <div class="item-row" style="border:none; padding:2px 0;">
                            <div class="item-info"><div class="item-name" style="font-size:0.8rem;">🚀 ENVÍO PRIORITARIO</div></div>
                            <div class="item-subtotal" style="font-size:0.8rem;">$2.000</div>
                        </div>
                    `;
                }
                if (data.opts.zonaExtendida) {
                    itemsEl.innerHTML += `
                        <div class="item-row" style="border:none; padding:2px 0;">
                            <div class="item-info"><div class="item-name" style="font-size:0.8rem;">🛵 ZONA EXTENDIDA</div></div>
                            <div class="item-subtotal" style="font-size:0.8rem;">$700</div>
                        </div>
                    `;
                } else if (data.opts.zonaPrincipal) {
                    itemsEl.innerHTML += `
                        <div class="item-row" style="border:none; padding:2px 0;">
                            <div class="item-info"><div class="item-name" style="font-size:0.8rem;">📍 ÁREA PRINCIPAL</div></div>
                            <div class="item-subtotal" style="font-size:0.8rem;">$0</div>
                        </div>
                    `;
                }
            }

            // Total
            document.getElementById('order-total').innerText = `$${parseInt(data.total).toLocaleString('es-AR')}`;

            // Customer
            document.getElementById('customer-info').innerHTML = `
                <p><strong>Cliente:</strong> ${data.name}</p>
                <p><strong>Teléfono:</strong> ${data.phone}</p>
                <p><strong>Horario:</strong> ${data.time}</p>
                <p><strong>Entrega:</strong> ${data.address}</p>
                <p><strong>Pago:</strong> ${data.payment}</p>
                <p><strong>Fecha:</strong> ${new Date().toLocaleString('es-AR')}</p>
            `;
        }

        init();
    </script>
</body>

</html>
