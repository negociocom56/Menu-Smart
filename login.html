<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puro Sabor | Acceso Admin</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-box">
            <img src="img/logo.webp" alt="Puro Sabor" class="brand-logo"
                style="margin:0 auto 20px; width:120px; height:auto; display:block;">
            <h2>Acceso al Panel</h2>
            <form id="login-form">
                <div class="form-group" style="text-align:left;">
                    <label>USUARIO</label>
                    <input type="text" id="user" placeholder="admin" required>
                </div>
                <div class="form-group" style="text-align:left;">
                    <label>CONTRASEÑA</label>
                    <input type="password" id="pass" placeholder="••••••••" required>
                </div>
                <p id="error-msg" class="error-msg">Usuario o contraseña incorrectos.</p>
                <button type="submit" class="btn-save" style="margin-top:16px;">INGRESAR</button>
            </form>
            <a href="index.html"
                style="display:block;margin-top:20px;color:var(--text-muted);font-size:0.8rem;text-decoration:none;">←
                Volver al Menú</a>
        </div>
    </div>
    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';
            const btn = document.querySelector('.btn-save');
            const originalText = btn.innerText;
            btn.innerText = 'CARGANDO...';
            btn.disabled = true;

            try {
                const res = await fetch('https://synergydev.com.ar/PScomanda/api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'login',
                        username: u,
                        password: p
                    })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('bocado_auth', 'true');
                    sessionStorage.setItem('bocado_user_role', data.rol || 'operador');
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.innerText = data.error || 'Usuario o contraseña incorrectos.';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.innerText = 'Error de conexión con el servidor.';
                errorMsg.style.display = 'block';
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>

</html>
